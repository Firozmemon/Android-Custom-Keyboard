plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

/*
 * Release signing is read from keystore.properties, which is gitignored: the
 * keystore is the app's identity on Play, so neither it nor its passwords
 * belong in the repo. Absent the file - a fresh clone, or CI without the
 * secret - the release build stays unsigned rather than failing, so debug
 * work and the test tasks still run.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.firozmemon.customkeyboard"

    /*
     * Compose 1.12 asks to be compiled against 37. That only widens the APIs
     * available at build time; targetSdk below is what opts the app in to new
     * runtime behaviour, and it stays where it was.
     */
    compileSdk = 37

    defaultConfig {
        applicationId = "com.firozmemon.customkeyboard"
        minSdk = 24
        targetSdk = 36
        versionCode = 3
        versionName = "2.0.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                // The key password defaults to the store password, which is
                // how this keystore was made - one password for both.
                keyPassword = keystoreProperties['keyPassword'] ?: keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Only sign when the secrets are present; otherwise leave it
            // unsigned rather than pointing at an empty config.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            /*
             * Kotlin module metadata and coroutine debug probes. Nothing reads
             * either at runtime - no reflection over Kotlin classes here - so
             * they are dead weight in the APK.
             */
            excludes += ["kotlin/**", "META-INF/*.version", "DebugProbesKt.bin"]
        }
    }

    androidResources {
        /*
         * The AndroidX modules ship their system strings in ~80 locales. Keep
         * English plus the languages this keyboard actually types, so users
         * running their phone in one of those still get localised strings.
         */
        localeFilters += ["en", "hi", "gu", "mr", "kn", "ta", "pa"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.material3
    implementation libs.androidx.ui.tooling.preview
    debugImplementation libs.androidx.ui.tooling

    testImplementation libs.junit

    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.test.manifest
}
