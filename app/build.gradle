plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace = "com.firozmemon.customkeyboard"

    /*
     * Compose 1.12 asks to be compiled against 37. That only widens the APIs
     * available at build time; targetSdk below is what opts the app in to new
     * runtime behaviour, and it stays where it was.
     */
    compileSdk = 37

    defaultConfig {
        applicationId = "com.firozmemon.customkeyboard"
        minSdk = 24
        targetSdk = 36
        versionCode = 3
        versionName = "2.0.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            /*
             * Kotlin module metadata and coroutine debug probes. Nothing reads
             * either at runtime - no reflection over Kotlin classes here - so
             * they are dead weight in the APK.
             */
            excludes += ["kotlin/**", "META-INF/*.version", "DebugProbesKt.bin"]
        }
    }

    androidResources {
        /*
         * The AndroidX modules ship their system strings in ~80 locales. Keep
         * English plus the languages this keyboard actually types, so users
         * running their phone in one of those still get localised strings.
         */
        localeFilters += ["en", "hi", "gu", "mr", "kn", "ta", "pa"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.material3
    implementation libs.androidx.ui.tooling.preview
    debugImplementation libs.androidx.ui.tooling

    testImplementation libs.junit

    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.test.manifest
}
