plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = "com.firozmemon.customkeyboard"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.firozmemon.customkeyboard"
        minSdk = 24
        targetSdk = 36
        versionCode = 2
        versionName = "1.0.1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            /*
             * Kotlin runtime metadata arrives from the AndroidX modules that
             * are written in Kotlin. Nothing here is Kotlin and nothing reads
             * it at runtime, so it is dead weight in the APK.
             */
            excludes += ["kotlin/**", "META-INF/*.version", "DebugProbesKt.bin"]
        }
    }

    androidResources {
        /*
         * AppCompat and Material ship their system strings in ~80 locales,
         * which is most of resources.arsc. Keep English plus the languages
         * this keyboard actually types, so users running their phone in one
         * of those still get localised framework strings.
         */
        localeFilters += ["en", "hi", "gu", "mr", "kn", "ta", "pa"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
